# Only set Connection: upgrade for actual WebSocket requests (Vite HMR);
# hardcoding it on every request breaks plain HTTP keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /php/ {
        rewrite ^/php/(.*)$ /$1 break;
        proxy_pass http://php:8081;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        # Vite's dev server pushes hot-module-reload updates over a WebSocket;
        # without these, nginx proxies it as a plain HTTP request and HMR
        # silently stops working when the app is accessed through the gateway.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

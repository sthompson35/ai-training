apiVersion: v1
kind: ConfigMap
metadata:
  name: academy-config
data:
  APP_ENV: "production"
  APP_VERSION: "2.4.0"
  POLICY_VERSION: "2.0.0"
  AI_LOCAL_ENABLED: "true"
  AI_MAX_INPUT_CHARS_LOCAL: "12000"
  REQUIRE_HUMAN_APPROVAL_TIER: "2"
  AUDIT_LOG_ENABLED: "true"
  # Placeholder — replace with the real deployed frontend origin(s).
  CORS_ALLOWED_ORIGINS: "https://academy.example.com"
  # In-memory, per-pod limits — with replicas: 2 below, the effective global
  # limit is roughly double these values. A real deployment needing an exact
  # global limit would back this with a shared store (e.g. Redis) instead.
  RATE_LIMIT_PER_MINUTE: "60"
  LOGIN_RATE_LIMIT_PER_MINUTE: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: academy-db-credentials
type: Opaque
stringData:
  POSTGRES_DB: "academy"
  POSTGRES_USER: "academy"
  POSTGRES_PASSWORD: "academy"
  DATABASE_URL: "postgresql+psycopg://academy:academy@academy-db:5432/academy"
---
apiVersion: v1
kind: Secret
metadata:
  name: academy-auth-secret
type: Opaque
stringData:
  AUTH_SECRET_KEY: "dev-only-insecure-secret-change-me"
  AUTH_TOKEN_EXPIRE_MINUTES: "1440"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: academy-db-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: academy-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: academy-db
  template:
    metadata:
      labels:
        app: academy-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: academy-db-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: academy-db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "academy", "-d", "academy"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: academy-db-data
          persistentVolumeClaim:
            claimName: academy-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: academy-db
spec:
  selector:
    app: academy-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: academy-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: academy-api
  template:
    metadata:
      labels:
        app: academy-api
    spec:
      containers:
        - name: api
          image: example/ai-training-academy-api:2.4.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: academy-config
            - secretRef:
                name: academy-db-credentials
            - secretRef:
                name: academy-auth-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: academy-api
spec:
  selector:
    app: academy-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: academy-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: academy-frontend
  template:
    metadata:
      labels:
        app: academy-frontend
    spec:
      containers:
        - name: frontend
          # Built from 08_INFRASTRUCTURE/docker/Dockerfile.frontend.prod — a
          # static production build served by nginx, not the dev-server image
          # docker-compose uses locally (Dockerfile.frontend). The API base
          # URL is baked in at build time as the relative path `/api`, so this
          # image works behind whatever hostname the gateway below is reached
          # at, with no per-environment env var needed here.
          image: example/ai-training-academy-frontend:2.4.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: academy-frontend
spec:
  selector:
    app: academy-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: academy-gateway-conf
data:
  # Same shape as 08_INFRASTRUCTURE/nginx/default.conf, adapted for the
  # cluster: proxy targets are the k8s Service names above rather than
  # docker-compose's `api`/`frontend` container names, and the WebSocket
  # upgrade headers (there for Vite's dev-server HMR) plus the `/php/`
  # location are dropped — the k8s frontend is a static build with no HMR,
  # and PHP has no k8s deployment (see academy.yaml's accompanying notes).
  default.conf: |
    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://academy-api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://academy-frontend;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: academy-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: academy-gateway
  template:
    metadata:
      labels:
        app: academy-gateway
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: gateway-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: gateway-conf
          configMap:
            name: academy-gateway-conf
---
apiVersion: v1
kind: Service
metadata:
  name: academy-gateway
spec:
  # The only external entry point in this manifest. A real deployment would
  # likely swap this for an Ingress + TLS termination instead — kept as a
  # plain LoadBalancer here for the same reason the rate-limiting/audit
  # tradeoffs elsewhere in this file are stated plainly rather than glossed
  # over: this is the reference-scale choice, not the only correct one.
  type: LoadBalancer
  selector:
    app: academy-gateway
  ports:
    - port: 80
      targetPort: 80

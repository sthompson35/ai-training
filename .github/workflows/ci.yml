name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r 07_PLATFORM/backend/requirements.txt

      - name: Compile Python
        run: python -m compileall 07_PLATFORM/backend/app

      - name: Test backend
        working-directory: 07_PLATFORM/backend
        run: python -m pytest -q

      - name: Syntax-check legacy hybrid-routing reference script (not part of the app bundle)
        run: node --check 07_PLATFORM/frontend/src/lib/hybridRouter.js

      - name: Install frontend dependencies
        working-directory: 07_PLATFORM/frontend
        run: npm ci

      - name: Test frontend
        working-directory: 07_PLATFORM/frontend
        run: npm run test

      - name: Typecheck and build frontend
        working-directory: 07_PLATFORM/frontend
        run: npm run build

      - name: Validate PHP syntax
        run: php -l 07_PLATFORM/php/health.php

      - name: Validate Docker Compose
        run: cp .env.example .env && docker compose config

  evidence:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm manifest.json matches the actual tree
        run: |
          cp manifest.json /tmp/manifest.committed.json
          python 08_INFRASTRUCTURE/scripts/generate_manifest.py
          if ! diff -q <(python -c "import json;d=json.load(open('/tmp/manifest.committed.json'));d['created_utc']='';print(json.dumps(d,sort_keys=True))") \
                       <(python -c "import json;d=json.load(open('manifest.json'));d['created_utc']='';print(json.dumps(d,sort_keys=True))") > /dev/null; then
            echo "::error::manifest.json is stale — run 'make manifest' and commit the result" >&2
            diff <(python -m json.tool /tmp/manifest.committed.json) <(python -m json.tool manifest.json) || true
            exit 1
          fi
          echo "manifest.json is current."

      - name: Generate CI run evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone

          def sha256_of(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  h.update(f.read())
              return h.hexdigest()

          checksums = {}
          for path in ("manifest.json", "CHANGELOG.md", "README_UPDATED.md"):
              if os.path.exists(path):
                  checksums[path] = sha256_of(path)

          record = {
              "generated_by": "ci.yml / evidence job",
              "generated_utc": datetime.now(timezone.utc).isoformat(),
              "commit": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF_NAME"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "checksums": checksums,
          }
          with open("evidence/ci_evidence.json", "w", encoding="utf-8") as f:
              json.dump(record, f, indent=2)
              f.write("\n")
          print(json.dumps(record, indent=2))
          PY

      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.sha }}
          path: evidence/ci_evidence.json
          retention-days: 90

  e2e:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Prepare frontend dependency mountpoint
        run: mkdir -p 07_PLATFORM/frontend/node_modules

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the gateway to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health; then exit 0; fi
            sleep 2
          done
          echo "Gateway never became healthy" && exit 1

      - name: Install frontend dependencies
        working-directory: 07_PLATFORM/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: 07_PLATFORM/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: 07_PLATFORM/frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: 07_PLATFORM/frontend/test-results

      - name: Tear down
        if: always()
        run: docker compose down -v
